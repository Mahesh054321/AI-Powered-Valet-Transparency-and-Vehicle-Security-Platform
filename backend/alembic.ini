# Alembic configuration for the Valet Transparency Platform.
# The database URL is NOT set here on purpose: migrations/env.py builds it from
# the same environment variables the application uses, so there is exactly one
# source of truth and no credentials in version control.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally omitted.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
