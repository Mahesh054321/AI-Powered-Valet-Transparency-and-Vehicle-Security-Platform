openapi: 3.0.3
info:
  title: AI-Powered Valet Transparency and Vehicle Security Platform API
  version: 1.0.0
  description: "REST API for the custody window between valet drop-off and pickup.\n\n## Conventions\n\
    \n**Envelope.** Every JSON response is wrapped:\n\n```json\n{\n  \"success\": true,\n  \"data\": {\
    \ },\n  \"meta\": { \"request_id\": \"…\", \"server_time\": 1789225490.85 }\n}\n```\n\nOn failure\
    \ `data` is replaced by `error: {code, message, details}`. `meta.request_id` is also returned as the\
    \ `X-Request-Id` header — quote it when reporting a problem.\n\n**Authentication.** `POST /api/v1/auth/login`\
    \ returns a JWT access token. Send it as `Authorization: Bearer <token>`. Tokens are HS256 and carry\
    \ `sub`, `role`, `typ`, `jti`, `iss`, `aud`, `iat`, `nbf` and `exp`; `alg: none` is rejected.\n\n\
    **Roles.** `CUSTOMER`, `VALET_OPERATOR`, `VALET_MANAGER`, `ADMIN`. Inheritance runs `ADMIN → VALET_MANAGER\
    \ → VALET_OPERATOR`; a `CUSTOMER` is not part of that chain and holds capabilities staff do not (such\
    \ as registering their own vehicle).\n\n**Versioning and aliases.** `/api/v1/...` is canonical. Several\
    \ modules are additionally mounted unversioned at `/api/...` — `auth`, `inspections`, `gps`, `geofences`,\
    \ `alerts`, `ml`, `retrieval` — because their contracts were originally specified that way. The handlers\
    \ are identical; only the prefix differs. `/api/health` and `/media/...` are unversioned by design.\n\
    \n**Honesty.** Simulated telemetry is labelled as such on every fix (`source`, `is_simulated`) and\
    \ in aggregate (`has_simulated_telemetry`). ML outputs carry a disclaimer and `trained_on_synthetic_data`.\
    \ Unverified damage findings are labelled *Potential Damage*, never confirmed damage."
  contact:
    name: Project documentation
    url: https://localhost:5000/api/health
  license:
    name: Academic use
servers:
- url: http://localhost:5000
  description: Local development
- url: http://127.0.0.1:5000
  description: Local development (loopback)
tags:
- name: Authentication
  description: Sign-in, sign-out and the signed-in identity.
- name: Users
  description: Administrator-managed accounts and the customer directory.
- name: Vehicles
  description: Customer vehicle records and their custody history.
- name: Valet Tickets
  description: 'The digital ticket lifecycle: issue, check in, complete, cancel.'
- name: Custody
  description: The custody session state machine and parking zones.
- name: Inspections
  description: Drop-off and pickup photo capture, comparison and verification.
- name: GPS
  description: Telemetry ingestion, simulation and the live tracking view.
- name: Geofencing
  description: Zones, boundaries and the movement classifier.
- name: Security Alerts
  description: Detector alerts and the centralized alert feed.
- name: Retrieval Prediction
  description: Retrieval-time estimates and the live queue.
- name: Reports
  description: Composed dashboards for customers, staff and managers.
- name: Audit Logs
  description: The append-only record of every significant action.
- name: System
  description: Health, readiness and stored media.
security:
- bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Self-register a customer account
      description: 'Creates a `CUSTOMER` account. This is the only public write route in the API.


        A `role` field may be sent but **only `CUSTOMER` is accepted** — asking for any other role returns
        `403`, so public registration can never produce staff. Passwords are stored as salted PBKDF2-SHA256
        digests (600,000 iterations by default), never as plain text.


        Login is rate limited: after 5 failed attempts for an email address further attempts are refused
        with `429` for a cooldown window.'
      tags:
      - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - full_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                  maxLength: 120
                phone:
                  type: string
                  nullable: true
                role:
                  type: string
                  enum:
                  - CUSTOMER
                  description: Optional. Only `CUSTOMER` is permitted here.
            example:
              email: aisha@example.com
              password: Str0ng#Passw0rd
              full_name: Aisha Verma
              phone: +91 98100 10010
      responses:
        '201':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  message: Account created. You can sign in now.
                  user:
                    created_at: '2026-09-12T16:01:46.071075+00:00'
                    email: docprobe.799e6643@example.com
                    full_name: Doc Probe
                    id: a280053c-b2ae-45b6-8541-3dbc8d459166
                    is_active: true
                    is_staff: false
                    phone: '9876543210'
                    role: CUSTOMER
                    status: ACTIVE
                    updated_at: '2026-09-12T16:01:46.071075+00:00'
                meta:
                  request_id: 8ac1f8634d6f4129bc2ee547b1fff1c6
                  server_time: 1789228906.249017
                success: true
        '403':
          description: Forbidden. A non-`CUSTOMER` role was requested. Staff accounts are created by an
            administrator via `POST /api/v1/auth/users`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: &id003
                  code: AUTHORIZATION_ERROR
                  message: 'Role ''CUSTOMER'' cannot read the audit trail. Required: VALET_MANAGER, ADMIN.'
                  details:
                    role: CUSTOMER
                    required:
                    - VALET_MANAGER
                    - ADMIN
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: A non-`CUSTOMER` role was requested. Staff accounts are created by an administrator
            via `POST /api/v1/auth/users`.
        '409':
          description: Conflict. An account with that email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: &id004
                  code: CONFLICT
                  message: Cannot move a session from IN_TRANSIT to RETRIEVAL_REQUESTED.
                  details:
                    from: IN_TRANSIT
                    to: RETRIEVAL_REQUESTED
                    allowed:
                    - PARKED
                    - RETRIEVAL_IN_PROGRESS
                    - READY_FOR_PICKUP
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: An account with that email already exists.
        '422':
          description: Unprocessable Entity. Missing or malformed field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: &id001
                  code: VALIDATION_ERROR
                  message: '''plate_number'' does not look like a valid Indian registration number.'
                  details:
                    field: plate_number
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: Missing or malformed field.
      x-auth: None (public)
      x-roles: None. This route is public.
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Exchange credentials for tokens
      description: 'Returns a short-lived access token and a long-lived refresh token, plus the signed-in
        user.


        The access token is a JWT (HS256) carrying `sub`, `role`, `typ`, `jti`, `iss`, `aud`, `iat`, `nbf`
        and `exp`. Send it as `Authorization: Bearer <access_token>`.


        Failed attempts are throttled per email address; the 6th consecutive failure returns `429` rather
        than `401`.'
      tags:
      - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: manager.karan@example.com
              password: Demo#Passw0rd
      responses:
        '201':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  user:
                    created_at: '2026-09-12T15:04:30.151668+00:00'
                    email: admin@valet.local
                    full_name: Platform Administrator
                    id: 14254104-597c-59d0-9fd5-7320e446a3e9
                    is_active: true
                    is_staff: true
                    phone: null
                    role: ADMIN
                    status: ACTIVE
                    updated_at: '2026-09-12T15:07:10.088861+00:00'
                meta:
                  request_id: 4a34d99e9e6d4231bc3623008e0597dd
                  server_time: 1789225630.9283738
                success: true
        '401':
          description: Unauthorized. The email or password is wrong. The message does not say which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: &id002
                  code: AUTHENTICATION_ERROR
                  message: Authentication is required to access this resource.
                  details: null
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: The email or password is wrong. The message does not say which.
        '429':
          description: Too Many Requests. Too many failed attempts for this email address. Retry after
            the cooldown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: RATE_LIMITED
                  message: Too many failed sign-in attempts. Try again later.
                  details:
                    retry_after_seconds: 300
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: Too many failed attempts for this email address. Retry after the cooldown.
        '422':
          description: Unprocessable Entity. Missing field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id001
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: Missing field.
      x-auth: None (public)
      x-roles: None. This route is public.
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token
      description: 'Revokes the presented refresh token by recording its `jti` in the `revoked_tokens`
        table, which is append-only. A revoked token cannot be used again even though it has not expired.


        The access token is *not* revoked — it stays valid until its own `exp`. Its lifetime is short
        (30 minutes by default) for exactly this reason.'
      tags:
      - Authentication
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to revoke.
            example:
              refresh_token: <refresh token from login>
      responses:
        '200':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  message: Signed out. The access token has been revoked.
                meta:
                  request_id: 7c492560da834508b64ad864598fc018
                  server_time: 1789228907.7065299
                success: true
        '401':
          description: Unauthorized. Missing, malformed or expired token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id002
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: Missing, malformed or expired token.
      x-auth: Bearer token required
      x-roles: 'Any authenticated role: `CUSTOMER`, `VALET_OPERATOR`, `VALET_MANAGER`, `ADMIN`.'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: The signed-in user
      description: Returns the account the presented token belongs to. Clients call this on startup to
        restore a session from a stored token and to learn the role that decides which navigation to render.
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  user:
                    created_at: '2026-09-12T15:04:30.151668+00:00'
                    email: admin@valet.local
                    full_name: Platform Administrator
                    id: 14254104-597c-59d0-9fd5-7320e446a3e9
                    is_active: true
                    is_staff: true
                    phone: null
                    role: ADMIN
                    status: ACTIVE
                    updated_at: '2026-09-12T15:07:10.088861+00:00'
                meta:
                  request_id: 4a34d99e9e6d4231bc3623008e0597dd
                  server_time: 1789225630.9283738
                success: true
        '401':
          description: Unauthorized. Missing, malformed or expired token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id002
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: Missing, malformed or expired token.
      x-auth: Bearer token required
      x-roles: 'Any authenticated role: `CUSTOMER`, `VALET_OPERATOR`, `VALET_MANAGER`, `ADMIN`.'
  /api/v1/auth/users:
    post:
      operationId: createUser
      summary: Create a staff account (administrator)
      description: 'Creates an account with an explicit role. This is the only way a `VALET_OPERATOR`,
        `VALET_MANAGER` or `ADMIN` account can come into existence — public registration refuses any non-customer
        role.


        The `role` is validated against the role vocabulary and an unknown value returns `422` listing
        the permitted ones.'
      tags:
      - Users
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - full_name
              - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                  maxLength: 120
                role:
                  type: string
                  enum:
                  - CUSTOMER
                  - VALET_OPERATOR
                  - VALET_MANAGER
                  - ADMIN
                phone:
                  type: string
                  nullable: true
            example:
              email: suresh@valet.local
              password: Str0ng#Passw0rd
              full_name: Suresh Yadav
              role: VALET_OPERATOR
      responses:
        '201':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  message: VALET_OPERATOR account created.
                  user:
                    created_at: '2026-09-12T16:01:46.418284+00:00'
                    email: docstaff.e26a78b4@example.com
                    full_name: Doc Staff
                    id: 801e7fea-b303-43d5-bd95-01164967a458
                    is_active: true
                    is_staff: true
                    phone: null
                    role: VALET_OPERATOR
                    status: ACTIVE
                    updated_at: '2026-09-12T16:01:46.418284+00:00'
                meta:
                  request_id: 4c808aac25e14a1b81c5be34ae67df8f
                  server_time: 1789228906.6376553
                success: true
        '403':
          description: Forbidden. The caller is not an administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id003
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: The caller is not an administrator.
        '409':
          description: Conflict. An account with that email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id004
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: An account with that email already exists.
        '422':
          description: Unprocessable Entity. Unknown role, or a missing/malformed field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id001
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: Unknown role, or a missing/malformed field.
      x-auth: Bearer token required
      x-roles: '`ADMIN` only.'
      x-role-enforced-by: Enforced by the `require_role(ADMIN)` decorator on the route.
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: Customer directory for check-in
      description: 'The customers a valet may hand a vehicle to. Exists so check-in can resolve a customer
        by name or email without exposing the full user table.


        Returns `id`, `full_name`, `email`, `phone` and `status` only — never a password digest or any
        other credential material.'
      tags:
      - Users
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
        description: Matches name or email.
      - &id005
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page number.
      - &id006
        name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Rows per page, capped at 200.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  items:
                  - email: customer.aisha@example.com
                    full_name: Aisha Verma
                    id: 5d4776d4-18f7-5bbd-934a-db567bb48f9a
                    phone: +91 98100 100 10
                    status: ACTIVE
                  - email: customer.rohit@example.com
                    full_name: Rohit Menon
                    id: 7692e411-48ff-50e3-91b3-9b721978a47d
                    phone: +91 98200 200 20
                    status: ACTIVE
                  total: 2
                meta:
                  request_id: 6ce4adb9f8954247a95cc89cb867e255
                  server_time: 1789225630.7651982
                success: true
        '401':
          description: Unauthorized. Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id002
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: Unauthenticated.
        '403':
          description: Forbidden. The caller is a customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id003
                meta:
                  request_id: 9cbb50455cdc4fabb7832bd0c04f5fd3
                  server_time: 1789225630.95
          x-note: The caller is a customer.
      x-auth: Bearer token required
      x-roles: '`VALET_OPERATOR`, `VALET_MANAGER` or `ADMIN`.'
      x-role-enforced-by: Enforced by the `require_role(...)` decorator on the route.
  /api/v1/vehicles:
    get:
      operationId: listVehicles
      summary: List the vehicles the caller may see
      description: 'Scoped server-side to the caller: a customer sees only their own vehicles, staff see
        every vehicle they may check in. Omitting a filter cannot widen the view.


        Ownership is derived from the token, never from a request parameter. A customer asking for someone
        else''s vehicle gets `404` rather than `403`, so the response does not confirm the id exists.'
      tags:
      - Vehicles
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - REGISTERED
          - IN_CUSTODY
          - FLAGGED
          - ARCHIVED
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
        description: Matches plate, make or model.
      - name: owner_id
        in: query
        required: false
        schema: &id007
          type: string
          format: uuid
        description: Staff only. Filter to one customer's vehicles.
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - *id005
      - *id006
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  items:
                  - color: Titan Grey
                    created_at: '2026-09-12T15:04:30.151668+00:00'
                    id: 448c7417-3c19-5bb7-862c-3a8c981f95e2
                    is_in_custody: false
                    make: Hyundai
                    model: Creta
                    normalized_plate: UP78CD5678
                    notes: '[DEMO] Seeded demonstration vehicle.'
                    owner:
                      email: customer.aisha@example.com
                      full_name: Aisha Verma
                      id: 5d4776d4-18f7-5bbd-934a-db567bb48f9a
                      phone: +91 98100 100 10
                    owner_id: 5d4776d4-18f7-5bbd-934a-db567bb48f9a
                    plate_number: UP 78 CD 5678
                    status: REGISTERED
                    updated_at: '2026-09-12T15:04:30.151668+00:00'
                    vin: null
                    year: 2022
                  - color: Nexa Blue
                    created_at: '2026-09-12T15:04:30.151668+00:00'
                    id: 41afc2ed-7d5d-5152-9f15-09a99d32fc47
                    is_in_custody: false
                    make: Maruti Suzuki
                    model: Baleno
                    normalized_plate: DL01CA9012
                    notes: '[DEMO] Seeded demonstration vehicle.'
                    owner:
                      email: customer.rohit@example.com
                      full_name: Rohit Menon
                      id: 7692e411-48ff-50e3-91b3-9b721978a47d
                      phone: +91 98200 200 20
                    owner_id: 7692e411-48ff-50e3-91b3-9b721978a47d
                    plate_number: DL 01 CA 9012
                    status: FLAGGED
                    updated_at: '2026-09-12T15:04:30.151668+00:00'
                    vin: null
                    year: 2024
                  - color: Pearl White
                    created_at: '2026-09-12T15:04:30.151668+00:00'
                    id: b88418a6-7799-5f31-856f-fd424e58a176
                    is_in_custody: true
                    make: Tata
                    model: Nexon
                    normalized_plate: UP78AB1234
                    notes: '[DEMO] Seeded demonstration vehicle.'
                    owner:
                      email: customer.aisha@example.com
                      full_name: Aisha Verma
                      id: 5d4776d4-18f7-5bbd-934a-db567bb48f9a
                      phone: +91 98100 100 10
                    owner_id: 5d4776d4-18f7-5bbd-934a-db567bb48f9a
                    plate_number: UP 78 AB 1234
                    status: IN_CUSTODY
                    updated_at: '2026-09-12T15:04:30.151668+00:00'
                    vin: null
                    year: 2023
                  pagination:
                    has_next: false
                    has_prev: false
                    page: 1
                    page_size: 20
                    total_items: 3
                    total_pages: 1
                meta:
                  request_id: 7c606132be5c40158e149333eb473d2c
                  server_time: 1789225630.7025304
                success: true
        '401':
          description: Unauthorized. Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error: *id002
                meta:
