    post:
      operationId: createVehicle
      summary: Register a vehicle
      description: 'A customer registers to themselves. Valet staff may pass `owner_id` to register on
        a customer''s behalf during check-in; a customer who sends `owner_id` is refused.


        The plate is validated against Indian registration formats and uniqueness is enforced by a partial
        unique index on the normalised plate, so a duplicate returns `409` naming the field.'
      tags:
      - Vehicles
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - plate_number
              - make
              properties: &id008
                plate_number:
                  type: string
                  description: 'Indian registration number. Separators are optional: `UP 85 CA 1234`,
                    `UP85CA1234` and the Bharat series `25BH0987AB` are all accepted.'
                make:
                  type: string
                  minLength: 2
                  maxLength: 60
                model:
                  type: string
                  maxLength: 60
                year:
                  type: integer
                  minimum: 1950
                  maximum: 2100
                color:
                  type: string
                  maxLength: 40
                vin:
                  type: string
                  maxLength: 40
                notes:
                  type: string
                  maxLength: 500
                owner_id:
                  allOf:
                  - *id007
                  description: Staff only. A customer registering for themselves must omit it — the owner
                    is taken from the token.
            example:
              plate_number: UP85CA1234
              make: Tata
              model: Nexon
              year: 2022
              color: Silver
              notes: Roof rack fitted.
