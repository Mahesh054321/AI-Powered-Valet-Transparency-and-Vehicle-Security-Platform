  /api/v1/feed:
    get:
      operationId: listAlertFeed
      summary: The centralized alert feed
      description: 'Every alert this actor may see, newest and worst first, across all sources.


        Role scoping is applied server-side to the query, so a customer cannot widen their view by omitting
        a parameter.


        `delivery: "polled"` is part of the response: this is a polled feed, not a push channel, and the
        client labels it that way rather than implying real-time delivery.


        `total` is in the body as well as in `meta`, because a client cannot render "page 2 of 9" from
        headers alone.'
      tags:
      - Security Alerts
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
          - DISMISSED
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - GEOFENCE_BREACH
          - SUSPICIOUS_MOVEMENT
          - OVERSPEED
          - POTENTIAL_DAMAGE
          - RETRIEVAL_READY
      - name: severity
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      - name: vehicle_id
        in: query
        required: false
        schema: *id007
      - name: unread_only
        in: query
        required: false
        schema: &id014
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 25
          maximum: 200
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                data:
                  alerts: []
                  delivery: polled
                  total: 0
                  unread: 0
                meta:
                  page: 1
                  page_size: 25
                  request_id: 566d9548b96b4132936c34c355b119fa
                  server_time: 1789225630.7358584
                  total: 0
                success: true
