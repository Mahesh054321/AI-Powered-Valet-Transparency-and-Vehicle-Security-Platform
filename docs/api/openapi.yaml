      summary: Generate a simulated track and ingest it
      description: 'Generates a track and ingests it as `SIMULATED` telemetry. Every fix passes through
        the **real** classification path, so the verdicts this produces are computed rather than scripted.


        The response is labelled honestly and repeatedly: `source: "SIMULATED"`, `is_simulated: true`,
        and a `notes` array stating that the track must not be presented as hardware data. The tracking
        view separates `has_hardware_telemetry` from `has_simulated_telemetry` for the same reason.'
      tags:
      - GPS
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - custody_id
              properties:
                custody_id:
                  allOf:
                  - *id007
                  description: Also accepted as `custody_session_id`.
                scenario:
                  type: string
                  enum:
                  - arrival
                  - jitter
                  - parked
                  - retrieval
                  - telemetry_loss
                  - unauthorised
                  default: parked
                seed:
                  type: integer
                  description: Fix the seed for a reproducible track.
                zone_id: *id007
