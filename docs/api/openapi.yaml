  /api/v1/inspections/{custody_id}:
    get:
      operationId: getConditionReport
      summary: The full condition report for a custody session
      description: 'Both photo sets, every finding, and the rendered evidence. The response is **flat**
        — `drop_off` and `pickup` sit at the top level rather than inside a wrapper list.


        `detector_disclaimer` travels with every report, so a client cannot render the findings without
        the caveat that produced them.'
      tags:
      - Inspections
