  /api/v1/audit:
    get:
      operationId: listAuditLog
      summary: Query the audit trail
      description: 'The append-only log of every significant action, newest first.


        `mutable: false` and `mutability_note` are part of the response: the table has a database-level
        trigger that refuses `UPDATE` and `DELETE`, so immutability is enforced by PostgreSQL rather than
        by convention.


        `vocabulary` lists the action values in use, so a client can build a filter from what actually
        exists.'
