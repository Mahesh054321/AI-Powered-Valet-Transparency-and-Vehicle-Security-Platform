              example:
                data:
                  charts:
                    custody_duration:
                      kind: bar
                      min_points: 10
                      n: 1
                      note: Distribution of hours between drop-off and pickup, in two-hour buckets. Shown
                        as a distribution rather than an average because the long tail is what occupies
                        bays.
                      series:
                      - bucket: 4-6h
                        value: 1
                      sufficient: false
                      title: Custody duration
                      unit: sessions
                    damage_detections:
                      by_region: []
                      kind: bar
                      min_points: 10
                      n: 6
                      note: Findings per week by verification outcome. CONFIRMED means a manager stood
                        behind the detector; REJECTED means it was a false positive; UNVERIFIED means
                        nobody has looked yet.
                      series:
