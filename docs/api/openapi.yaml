    post:
      operationId: ingestGpsEvents
      summary: Record position fixes
      description: 'Accepts either a single fix object or `{"fixes": [...]}`. Both shapes reach the same
        service path, so a batch is classified exactly as its members would be individually.


        This user-submitted endpoint accepts only `MANUAL` provenance. Use `/mobile` for authorized browser
        fixes or authenticated registered-device telemetry for `REAL_GPS`.


        Every fix is passed through the real geofence classifier on the way in; the response reports the
        verdict, the rules that fired and any alerts raised.


        The `gps_events` table is append-only: a recorded fix cannot be edited or deleted afterwards.'
