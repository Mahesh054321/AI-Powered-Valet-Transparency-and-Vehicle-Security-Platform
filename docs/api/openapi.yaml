        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  enum:
                  - GEOFENCE_BREACH
                  - SUSPICIOUS_MOVEMENT
                  - OVERSPEED
                  - POTENTIAL_DAMAGE
                  - RETRIEVAL_READY
                message:
                  type: string
                severity:
                  type: string
                  enum:
                  - LOW
                  - MEDIUM
                  - HIGH
                  - CRITICAL
