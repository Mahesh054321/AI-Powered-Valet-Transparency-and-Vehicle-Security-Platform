  /api/v1/uploads/images:
    post:
      operationId: uploadImages
      summary: Store images and get validated references back
      description: 'Accepts `multipart/form-data`. Send one or more files under the `images` field (a
        single `image` field also works).


        Each file is validated before it is stored: extension allow-list (`jpg`, `jpeg`, `png`, `webp`),
        minimum 64 pixels per side, maximum 4096. The stored reference is returned with its SHA-256 digest,
        so an inspection can later prove which bytes it assessed.


        The returned `path` values are what the inspection endpoints expect.'
      tags:
      - Inspections
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files.
                image:
                  type: string
                  format: binary
                  description: Alternative single-file field.
                subdir:
                  type: string
                  default: inspections
                label:
                  type: string
            example:
              images: <binary>
              subdir: inspections
