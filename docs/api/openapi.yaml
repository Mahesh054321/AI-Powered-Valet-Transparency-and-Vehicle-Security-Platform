    post:
      operationId: createGeofence
      summary: Create a geofenced zone
      description: 'Accepts the brief''s `centre + radius` description and generates a circular ring into
        `geofence_polygon`, so the API matches the specification while the stored shape stays a polygon
        — one point-in-polygon test then serves both this and an irregular real-world yard.


        Pass an explicit `geofence_polygon` instead for a non-circular yard. `radius` is ignored when
        a polygon is supplied.'
      tags:
      - Geofencing
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              - latitude
              - longitude
              properties:
                code:
                  type: string
                  maxLength: 32
                  description: Upper-cased on store. Must be unique.
                name:
                  type: string
                  maxLength: 80
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                radius:
                  type: number
                  description: Metres. Generates a circular ring.
                capacity:
                  type: integer
                  minimum: 1
                  default: 1
                buffer_metres:
                  type: number
                description:
                  type: string
                geofence_polygon:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                  description: Optional explicit `[longitude, latitude]` ring, for an irregular yard.
            example:
              code: ZONE-D
              name: Zone D - Overflow
              latitude: 28.6139
              longitude: 77.209
              radius: 60
              capacity: 10
