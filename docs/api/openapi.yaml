      operationId: captureDropOff
      summary: Capture the drop-off photo set
      description: 'Records a `DROP_OFF` inspection against a custody session.


        This is the baseline every later comparison is measured against. Nothing is compared at this stage,
        because there is no *after* yet.


        One angle is sent per photo as a **parallel `angles` list**. A count mismatch is rejected rather
        than guessed, because applying one angle to a mixed set would compare unrelated viewpoints and
