      x-roles: 'Any authenticated role: `CUSTOMER`, `VALET_OPERATOR`, `VALET_MANAGER`, `ADMIN`.'
    post:
      operationId: createAlertFeedItem
      summary: Raise an alert into the feed
      description: 'Staff-only. Lets a valet or manager raise something the detectors do not cover.


        Creating the same alert twice is idempotent where the source allows it: the response reports whether
        a new row was created.'
      tags:
      - Security Alerts
