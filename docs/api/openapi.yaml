      - Inspections
      parameters:
      - name: detection_id
        in: path
        required: true
        schema: *id007
        description: The damage finding's UUID.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
