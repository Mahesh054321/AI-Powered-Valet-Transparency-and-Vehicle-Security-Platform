  /api/v1/manager/dashboard:
    get:
      operationId: getManagerDashboard
      summary: The manager dashboard
      description: 'Metrics, charts and tables for a date range, composed server-side.


        `filter_options` is part of the response, so the filter dropdowns are built from what the backend
        can actually serve rather than from a hard-coded list in the client. `provenance` records what
        the numbers were computed from.'
