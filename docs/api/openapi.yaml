  /api/v1/inspections/detections/{detection_id}/verification:
    patch:
      operationId: verifyDetection
      summary: Confirm or reject a damage finding
      description: 'Moves a finding between `UNVERIFIED`, `CONFIRMED` and `REJECTED`.


        Deliberately narrower than capture: the person who photographed the car should not be the only
        person who judges whether the algorithm was right about it.


        `presentation_label` changes with the status — `Potential Damage`, `Confirmed Damage`, `Dismissed
        - Not Damage`.'
