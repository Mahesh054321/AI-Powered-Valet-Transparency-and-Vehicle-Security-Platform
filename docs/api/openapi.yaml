      operationId: archiveVehicle
      summary: Archive a vehicle
      description: 'Soft-deletes: the row moves to `ARCHIVED` and drops out of the active list, but the
        custody history that references it is preserved. Nothing is destroyed, because the audit trail
        must stay intact.


        A vehicle that is currently in custody cannot be archived — close the custody session first.


        Returns `204` with an empty body on success.'
