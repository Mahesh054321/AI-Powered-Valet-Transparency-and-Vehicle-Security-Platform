    patch:
      operationId: updateCustodySession
      summary: Move a custody session to a new state
      description: 'Every write is checked against the permitted transition table, and an illegal jump
        is refused with **409** carrying `{from, to, allowed}` so a client can recover instead of guessing.


        Permitted transitions:


        ```

        CHECKED_IN            -> PARKED, IN_TRANSIT

        PARKED                -> IN_TRANSIT, RETRIEVAL_REQUESTED, READY_FOR_PICKUP

        IN_TRANSIT            -> PARKED, RETRIEVAL_IN_PROGRESS, READY_FOR_PICKUP

        RETRIEVAL_REQUESTED   -> RETRIEVAL_IN_PROGRESS, READY_FOR_PICKUP

        RETRIEVAL_IN_PROGRESS -> READY_FOR_PICKUP

        READY_FOR_PICKUP      -> CHECKED_OUT, RETRIEVAL_IN_PROGRESS

        DISPUTED              -> CHECKED_OUT

        CHECKED_OUT           -> (terminal)

        ```


        `CHECKED_OUT` is not reachable through this route at all: it returns `422` directing the caller
