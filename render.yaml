# Render Free demo Blueprint (November 2026).
# CAUTION: Render Free Postgres expires after 30 days and has no backups.
# Free Web Services have ephemeral filesystems: uploaded photos will not persist
# across a service restart or redeploy. Do not use with real vehicle/customer data.
# Check the actual Render service URLs after provisioning.
services:
  - type: web
    name: valet-api-demo-054321
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/readyz
    # No preDeployCommand: Render only supports it on paid web services.
    # The backend/docker-entrypoint.sh script runs idempotent migrations at boot.
    # No disk: Render Free does not support persistent disks.
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: valet-db-demo-054321
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://valet-web-demo-054321.onrender.com
      - key: UPLOAD_FOLDER
        value: /app/storage/media
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '1'
      - key: JSON_LOGS
        value: '1'
      - key: FLASK_DEBUG
        value: '0'

  - type: web
    name: valet-web-demo-054321
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://valet-api-demo-054321.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://valet-api-demo-054321.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api

databases:
  - name: valet-db-demo-054321
    plan: free
    region: singapore
    databaseName: valet_db
    user: valet_user
