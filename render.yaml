# Render-only deployment: paid API with persistent image storage, Static Site,
# and managed PostgreSQL. Review plan prices before creating this Blueprint.
# Backend and frontend subdomain destinations below assume these unique names
# are available; edit after creation if Render assigns different URLs.
services:
  - type: web
    name: valet-api-demo-054321
    runtime: docker
    plan: standard
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/readyz
    numInstances: 1
    # Supported on paid web services, runs on a separate compute instance.
    preDeployCommand: python utils/scripts/init_db.py
    disk:
      name: valet-evidence
      mountPath: /app/storage/media
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: valet-db-demo-054321
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://valet-web-demo-054321.onrender.com
      - key: UPLOAD_FOLDER
        value: /app/storage/media
      - key: DB_POOL_SIZE
        value: '3'
      - key: DB_MAX_OVERFLOW
        value: '2'
      - key: JSON_LOGS
        value: '1'
      - key: FLASK_DEBUG
        value: '0'

  - type: web
    name: valet-web-demo-054321
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Keep these before the SPA fallback. Both are required by this project.
      - type: rewrite
        source: /api/*
        destination: https://valet-api-demo-054321.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://valet-api-demo-054321.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api

databases:
  - name: valet-db-demo-054321
    plan: 0.1c-256mb
    region: singapore
    databaseName: valet_db
    user: valet_user
